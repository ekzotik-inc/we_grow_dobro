# Чертёж развёртывания на Render (https://render.com/docs/blueprint-spec).
# Как применить: Render → New → Blueprint → выбрать этот репозиторий → Apply.
#
# База — платный Postgres на Render: фиксированная цена, не засыпает, без квот по времени.
# Строка подключения подставляется автоматически из блока databases ниже.
databases:
  - name: we-grow-dobro-db
    databaseName: dobro
    user: dobro
    plan: basic-256mb          # минимальный платный тариф; хватает с запасом
    region: frankfurt
services:
  - type: web
    name: we-grow-dobro
    runtime: python
    plan: free
    region: frankfurt          # ближе к Европе; Telegram доступен напрямую
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /api/health
    autoDeploy: true           # каждый git push в main выкатывается сам
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # sync: false — Render спросит значение при развёртывании и не сохранит его в git
      - key: DATABASE_URL      # подставляется из базы выше, вручную вписывать не нужно
        fromDatabase:
          name: we-grow-dobro-db
          property: connectionString
      - key: BOT_TOKEN         # токен от @BotFather
        sync: false
      - key: ADMIN_IDS         # владелец бота
        value: "1357560299"
      - key: PC_IDS            # сотрудники P&C: им уходят заявки, вопросы и доступ в панель
        value: "101727102"
      # Привязка каналов хранится в базе. Указав id здесь, вы не потеряете её при чистой базе.
      - key: REG_CHANNEL_ID    # канал заявок, например -1001234567890
        sync: false
      - key: RESULTS_CHANNEL_ID  # канал результатов
        sync: false
      - key: PC_CONTACT        # как называть сотрудника P&C в сообщениях
        value: "Дарья (P&C)"
      - key: PC_USERNAME       # его Telegram-логин — участник получает прямую ссылку
        value: "DaryaPMI"
      - key: PHONE_COUNTRY_CODE  # код страны для номеров, набранных без него
        value: "998"
      - key: TZ
        value: Asia/Tashkent
      - key: PREMIUM_EMOJI   # 1 = премиум-эмодзи; нужен Telegram Premium у владельца бота
        value: "1"
      - key: VOICE_NAME      # имя, от которого бот говорит в цитатах
        value: "Добрик"
      - key: DB_KEEPALIVE_MINUTES  # 4 — база не засыпает; 0 — не будить (экономия квоты Neon)
        value: "4"
      - key: MOTIVATION_HOUR   # час мотивирующего сообщения (через день)
        value: "11"
      - key: TOP_HOUR          # час публикации топа (среда и воскресенье)
        value: "19"
      - key: WEEK1_START       # периоды марафона; конец недели — включительно
        value: "2026-09-10"
      - key: WEEK1_END
        value: "2026-09-13"
      - key: WEEK2_START
        value: "2026-09-14"
      - key: WEEK2_END
        value: "2026-09-20"
      - key: WEEK3_START
        value: "2026-09-21"
      - key: WEEK3_END
        value: "2026-09-27"
      - key: WEEKLY_WEEKDAY    # день еженедельной мотивации: 0 — понедельник
        value: "0"
      - key: WEEKLY_HOUR       # час еженедельной мотивации
        value: "10"
      - key: DB_EXPIRES_AT     # у платной базы Render срока нет — оставляем пустым
        value: ""
