# Чертёж развёртывания на Render (https://render.com/docs/blueprint-spec).
# Как применить: Render → New → Blueprint → выбрать этот репозиторий → Apply.
#
# База данных здесь НЕ создаётся: Render разрешает только одну бесплатную базу на аккаунт,
# и её удаляют через 30 дней. Вместо неё берём бесплатный Postgres на neon.tech (он бессрочный)
# и вставляем строку подключения в DATABASE_URL при развёртывании — см. README.
services:
  - type: web
    name: we-grow-dobro
    runtime: python
    plan: free
    region: frankfurt          # ближе к Европе; Telegram доступен напрямую
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /api/health
    autoDeploy: true           # каждый git push в main выкатывается сам
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # sync: false — Render спросит значение при развёртывании и не сохранит его в git
      - key: DATABASE_URL      # строка подключения из Neon, целиком, вместе с ?sslmode=require
        sync: false
      - key: BOT_TOKEN         # токен от @BotFather
        sync: false
      - key: ADMIN_IDS         # ваш Telegram id (узнать: @userinfobot)
        sync: false
      - key: PC_IDS            # id сотрудников P&C; пусто = заявки и вопросы уходят админам
        sync: false
      - key: TZ
        value: Asia/Almaty
      - key: PREMIUM_EMOJI   # 1 = премиум-эмодзи; нужен Telegram Premium у владельца бота
        value: "1"
      - key: VOICE_NAME      # имя, от которого бот говорит в цитатах
        value: "Добрик"
      - key: MOTIVATION_HOUR   # час мотивирующего сообщения (через день)
        value: "11"
      - key: TOP_HOUR          # час публикации топа (среда и воскресенье)
        value: "19"
      - key: FORCE_WEEK        # 1/2/3 — принудительно открыть неделю для теста, 0 — обычный режим
        value: "0"
      - key: DB_EXPIRES_AT     # с Neon оставьте пустым: база бессрочная
        value: ""
